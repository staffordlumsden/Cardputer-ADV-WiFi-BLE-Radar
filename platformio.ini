[platformio]
default_envs = radar-cardputer-adv
src_dir = src

[env:radar-cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 1500000
lib_extra_dirs = lib
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_CARDPUTER_ADV=1
    -DCARDPUTER_OS_APP=1
    -DCARDPUTER_OS_SDK_VERSION=1
    -DCARDPUTER_OS_APP_ID=\"radar\"
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    bblanchon/ArduinoJson@7.4.3
extra_scripts =
    pre:tools/pio_guard.py
